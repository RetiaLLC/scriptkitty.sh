id: usb-nugget-circuitpython
display_name: "CircuitPython"
product_line: usb-nugget
model: "USB Nugget"
mcu: esp32-s2
version: "10.2.1"
description: "CircuitPython 10.2.1 for the USB Nugget (Rubber Nugget), pre-loaded with the RubberNugget defaults. The onboard SH1106 OLED, the four buttons, and the GPIO12 NeoPixel are all defined and working out of the box, and it boots straight into the 5-payload DuckyScript menu. Everything lives on the editable CIRCUITPY drive."
program_url: https://github.com/RetiaLLC/RubberNugget-CircuitPython
quickstart:
  - "Flash this firmware, then unplug and replug to boot CircuitPython 10.2.1."
  - "A CIRCUITPY drive appears with code.py, boot.py, lib/, faces/ and payload1-4/payload.txt already installed."
  - "The OLED shows the menu face; the onboard NeoPixel (GPIO12) glows teal = ready, red = a payload is running."
  - "Press one of the four buttons to run payload1.txt..payload4.txt; edit those files on the CIRCUITPY drive to change them."
  - "Hold the down button (IO18) while plugging in to hide the CIRCUITPY drive from the host PC."
next_steps:
  - "Open the CIRCUITPY drive and edit payload1.txt through payload4.txt (DuckyScript) to set your own keystroke payloads."
  - "code.py already defines the screen (SH1106 @ 0x3c on SCL/SDA), buttons (IO9/IO18/IO11/IO7), and NeoPixel (GPIO12) — tweak it and CircuitPython re-runs the moment you save."
provenance:
  binary_source: static
  exception: "0x0 flash image: the official CircuitPython 10.2.1 interpreter for board lolin_s2_mini (downloads.circuitpython.org) merged with a pre-populated CIRCUITPY (ffat, FAT @ 0x310000) filesystem carrying the RubberNugget defaults — code.py/boot.py/lib/faces/payloads. code.py is updated for the CircuitPython 9+/10 API (i2cdisplaybus.I2CDisplayBus + display.root_group) with a GPIO12 NeoPixel added; lib/ .mpy are from the CircuitPython 10.x Adafruit bundle (incl. adafruit_ticks, required by the 10.x debouncer). Built + hardware-verified on-bench (ESP32-S2FN4R2; CIRCUITPY mounts read-write and screen+buttons+NeoPixel init clean with no traceback)."
  imported_from:
    repo: adafruit/circuitpython
    path: bin/lolin_s2_mini/en_US/adafruit-circuitpython-lolin_s2_mini-en_US-10.2.1.bin
  defaults_source:
    repo: RetiaLLC/RubberNugget-CircuitPython
    ref: main
    note: "code.py ported to CircuitPython 10.x (i2cdisplaybus + display.root_group) and given an onboard GPIO12 NeoPixel (teal=ready, red=running); lib refreshed from the CP 10.x Adafruit bundle."
