id: usb-nugget-circuitpython
display_name: "CircuitPython"
product_line: usb-nugget
model: "USB Nugget"
mcu: esp32-s2
description: "CircuitPython for the USB Nugget (Rubber Nugget), pre-loaded with the RubberNugget defaults. The onboard SH1106 OLED, the four buttons, and the GPIO12 NeoPixel are all defined and working out of the box, and it boots straight into the 5-payload DuckyScript menu. Everything lives on the editable CIRCUITPY drive. Tracks upstream CircuitPython automatically."
program_url: https://github.com/RetiaLLC/CircuitPython
quickstart:
  - "Flash this firmware, then unplug and replug to boot CircuitPython."
  - "A CIRCUITPY drive appears with code.py, boot.py, lib/, faces/ and payload1-4/payload.txt already installed."
  - "The OLED shows the menu face; the onboard NeoPixel (GPIO12) glows teal = ready, red = a payload is running."
  - "Press one of the four buttons to run payload1.txt..payload4.txt; edit those files on the CIRCUITPY drive to change them."
  - "Hold the down button (IO18) while plugging in to hide the CIRCUITPY drive from the host PC."
next_steps:
  - "Open the CIRCUITPY drive and edit payload1.txt through payload4.txt (DuckyScript) to set your own keystroke payloads."
  - "code.py already defines the screen (SH1106 @ 0x3c on SCL/SDA), buttons (IO9/IO18/IO11/IO7), and NeoPixel (GPIO12) — tweak it and CircuitPython re-runs the moment you save."
provenance:
  # channel: tracks ALL RetiaLLC/CircuitPython releases — full releases are hardware-VERIFIED
  # (default flash), prereleases are untested auto-builds (new upstream CircuitPython versions,
  # built by that repo's workflow) offered behind a warning until promoted.
  binary_source: channel
  channel:
    repo: RetiaLLC/CircuitPython
    asset_pattern: "usb-nugget-circuitpython.factory.bin"
    verification_pattern: "verification-usb-nugget.json"
