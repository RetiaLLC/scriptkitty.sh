id: usb-nugget-badusb
display_name: "USB Nugget"
product_line: usb-nugget
model: "USB Nugget"
mcu: esp32-s2
version: "1.0.0"
description: "USB BadUSB / keystroke-injection platform for the ESP32-S2 USB Nugget. The stable default is the original USB Nugget firmware (single auto-run payload.dd). An experimental Retia 'Bad Nugget' port is available in the untested-builds section: a multi-payload menu UI with a DuckyScript interpreter, an on-device Wi-Fi payload editor, and composite CDC+MSC+HID."
program_url: https://github.com/RetiaLLC/USB-Nugget
recommended: true
quickstart:
  - "Stable (default): flash, then unplug and replug — it mounts as a USB drive; edit payload.dd to set your DuckyScript and it runs automatically on the next plug-in. Press BOOT to re-run."
  - "Experimental (Bad Nugget port, in the untested-builds section): flash, then replug — it mounts as a USB drive AND a keyboard. Drop .txt DuckyScript payloads on the drive or manage them from the Wi-Fi web UI; the on-screen d-pad browses and runs them."
  - "Only use this on computers you own or are explicitly authorized to test — it injects real keystrokes."

provenance:
  binary_source: channel
  channel:
    repo: RetiaLLC/USB-Nugget
    asset_pattern: "usb-nugget-badusb.factory.bin"      # same asset name in the stable + experimental releases
    verification_pattern: "verification-usb-nugget.json" # per-target evidence sidecar (attach to promote the port)
