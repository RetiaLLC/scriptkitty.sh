id: nibble-zero-circuitpython
display_name: "CircuitPython"
product_line: nibble
model: "Nibble Zero"
mcu: esp32-s3
description: "CircuitPython for the Nibble Zero (ESP32-S3-Zero), pre-loaded with a starter that defines the onboard peripherals out of the box: the 128x64 SSD1306 OLED, all 6 buttons, and the GPIO21 NeoPixel. Boots to a welcome screen; press any key to cycle the NeoPixel. Everything lives on the editable CIRCUITPY drive. Tracks upstream CircuitPython automatically."
program_url: https://github.com/RetiaLLC/CircuitPython
quickstart:
  - "Flash this firmware, then unplug and replug the Nibble to boot CircuitPython."
  - "A CIRCUITPY drive appears with code.py and lib/ already installed."
  - "The 128x64 OLED shows a welcome screen; the onboard NeoPixel (GPIO21) glows teal."
  - "Press any of the 6 keys to cycle the NeoPixel color and show which key was pressed."
next_steps:
  - "Open the CIRCUITPY drive and edit code.py to build your own project."
  - "code.py already defines the screen (SSD1306 128x64 @ 0x3c on SDA IO8 / SCL IO7, rotation 0), the 6 buttons (A IO1, B IO2, UP IO42, DOWN IO41, LEFT IO40, RIGHT IO45), and the NeoPixel (IO21) — CircuitPython re-runs the moment you save."
provenance:
  # channel: tracks ALL RetiaLLC/CircuitPython releases (full = verified default, prerelease = untested).
  binary_source: channel
  channel:
    repo: RetiaLLC/CircuitPython
    asset_pattern: "nibble-zero-circuitpython.factory.bin"
    verification_pattern: "verification-nibble-zero.json"
