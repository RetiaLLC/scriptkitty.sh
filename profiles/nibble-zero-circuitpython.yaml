id: nibble-zero-circuitpython
display_name: "CircuitPython"
product_line: nibble
model: "Nibble Zero"
mcu: esp32-s3
version: "10.2.1"
description: "CircuitPython 10.2.1 for the Nibble Zero (ESP32-S3-Zero), pre-loaded with a starter that defines the onboard peripherals out of the box: the 128x64 SSD1306 OLED (mounted upside-down), all 6 buttons, and the GPIO21 NeoPixel. Boots to a welcome screen; press any key to cycle the NeoPixel. Everything lives on the editable CIRCUITPY drive."
program_url: https://github.com/RetiaLLC/Nibble
quickstart:
  - "Flash this firmware, then unplug and replug the Nibble to boot CircuitPython 10.2.1."
  - "A CIRCUITPY drive appears with code.py and lib/ already installed."
  - "The 128x64 OLED shows a welcome screen; the onboard NeoPixel (GPIO21) glows teal."
  - "Press any of the 6 keys to cycle the NeoPixel color and show which key was pressed."
next_steps:
  - "Open the CIRCUITPY drive and edit code.py to build your own project."
  - "code.py already defines the screen (SSD1306 128x64 @ 0x3c on SDA IO8 / SCL IO7, rotation 180), the 6 buttons (A IO1, B IO2, UP IO42, DOWN IO41, LEFT IO40, RIGHT IO45), and the NeoPixel (IO21) — CircuitPython re-runs the moment you save."
provenance:
  binary_source: static
  exception: "0x0 flash image: the official CircuitPython 10.2.1 interpreter for board waveshare_esp32_s3_zero (downloads.circuitpython.org) merged with a pre-populated CIRCUITPY (ffat, FAT @ 0x310000) filesystem carrying a Retia starter code.py + the CircuitPython 10.x Adafruit libraries (adafruit_displayio_ssd1306, adafruit_display_text, neopixel, adafruit_debouncer, adafruit_ticks). The starter defines the SSD1306 128x64 OLED, 6 buttons, and GPIO21 NeoPixel. Built + hardware-verified on Workbench5 (ESP32-S3, CIRCUITPY mounts read-write and code.py runs clean with no traceback; the OLED responds at 0x3C on IO7/IO8 and the NeoPixel initializes on IO21)."
  imported_from:
    repo: adafruit/circuitpython
    path: bin/waveshare_esp32_s3_zero/en_US/adafruit-circuitpython-waveshare_esp32_s3_zero-en_US-10.2.1.bin
