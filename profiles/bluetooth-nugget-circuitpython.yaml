id: bluetooth-nugget-circuitpython
display_name: "CircuitPython"
product_line: bluetooth-nugget
model: "Bluetooth Nugget"
mcu: esp32-s3
description: "CircuitPython for the Bluetooth Nugget (ESP32-S3), pre-loaded with a starter that defines the onboard peripherals out of the box: the 128x64 SSD1306 OLED, all 6 buttons, and the two GPIO10 NeoPixel ears. Boots to a welcome screen; press any key to cycle the NeoPixels. Everything lives on the editable CIRCUITPY drive. Tracks upstream CircuitPython automatically."
program_url: https://github.com/RetiaLLC/CircuitPython
quickstart:
  - "Flash this firmware, then unplug and replug the Nugget to boot CircuitPython."
  - "A CIRCUITPY drive appears with code.py and lib/ already installed."
  - "The 128x64 OLED shows a welcome screen; the two onboard NeoPixel ears (GPIO10) glow teal."
  - "Press any of the 6 keys to cycle the NeoPixel color and show which key was pressed."
next_steps:
  - "Open the CIRCUITPY drive and edit code.py to build your own project."
  - "code.py already defines the screen (SSD1306 128x64 @ 0x3c on SDA IO35 / SCL IO36, rotation 180), the 6 buttons (A IO44, B IO43, UP IO13, DOWN IO18, LEFT IO11, RIGHT IO12), and the 2 NeoPixels (IO10) — CircuitPython re-runs the moment you save."
provenance:
  # channel: tracks ALL RetiaLLC/CircuitPython releases (full = verified default, prerelease = untested).
  binary_source: channel
  channel:
    repo: RetiaLLC/CircuitPython
    asset_pattern: "bluetooth-nugget-circuitpython.factory.bin"
    verification_pattern: "verification-bluetooth-nugget.json"
